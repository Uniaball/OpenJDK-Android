name: Build OpenJDK27 for Android (Optimization Solution)
run-name: Build OpenJDK27 for Android (Optimization Solution)
on:
  push:

jobs:
  build_android:
    strategy:
      fail-fast: false

    name: "Build for Android aarch64"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - name: set up JDK 26
      uses: actions/setup-java@main
      with:
        java-version: 26-ea
        distribution: zulu

    - name: Install build dependencies
      run: |    
       sudo apt update
       sudo apt -y install systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev

    - name: Get upstream commit hashes
      id: upstream
      run: |
        echo "freetype_hash=$(git ls-remote https://github.com/LWJGL-CI/freetype HEAD | cut -f1)" >> $GITHUB_OUTPUT
        echo "cups_hash=$(git ls-remote https://github.com/OpenPrinting/cups HEAD | cut -f1)" >> $GITHUB_OUTPUT

    - name: Cache Freetype build
      uses: actions/cache@v4
      with:
        path: freetype/build_android-arm64
        key: freetype-build-${{ runner.os }}-${{ steps.upstream.outputs.freetype_hash }}-${{ hashFiles('buildlibs.sh') }}
        restore-keys: |
          freetype-build-${{ runner.os }}-

    - name: Cache CUPS source
      uses: actions/cache@v4
      with:
        path: cups
        key: cups-src-${{ runner.os }}-${{ steps.upstream.outputs.cups_hash }}-${{ hashFiles('getlibs.sh') }}
        restore-keys: |
          cups-src-${{ runner.os }}-

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ github.job }}
        create-symlink: true
        max-size: 2G

    - name: Build with CI build script
      run: bash "ci_build_arch_aarch64.sh"

    - name: Upload JDK build output
      uses: actions/upload-artifact@main
      with:
        name: "jdk27"
        path: jdk27*.tar.xz

    - name: Upload JRE build output
      uses: actions/upload-artifact@main
      with:
        name: "jre27"
        path: jre27*.tar.xz