name: Build OpenJDK17 for Android
#1
on:
  push:
jobs:
  build_android:
    strategy:
      fail-fast: false

    name: "Build for Android"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@main
    - name: set up JDK 17
      uses: actions/setup-java@main
      with:
        java-version: 17.0.17
        distribution: zulu
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt -y install systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev
    - name: Build with CI build script
      run: bash "ci_build_arch_aarch64.sh"
    - name: Upload JDK build output
      uses: actions/upload-artifact@main
      with:
        name: "jdk17"
        path: jdk17*.tar.xz
    - name: Upload JRE build output
      uses: actions/upload-artifact@main
      with:
        name: "jre17"
        path: jre17*.tar.xz
    - name: Upload JRE debuginfo build output
      uses: actions/upload-artifact@main
      with:
        name: "jre17-debuginfo"
        path: dizout
