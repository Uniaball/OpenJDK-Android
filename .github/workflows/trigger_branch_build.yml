name: Trigger Branch Builds
on:
  schedule:
    - cron: '0 16 * * 5'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: 17
            workflow: build17.yml
          - branch: 21
            workflow: build21.yml
          - branch: 25
            workflow: build25.yml
          - branch: 26
            workflow: build.yml
          - branch: 27
            workflow: build27_os.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Trigger workflow on branch ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering ${{ matrix.workflow }} on branch ${{ matrix.branch }}"
          gh workflow run "${{ matrix.workflow }}" --ref "${{ matrix.branch }}" || {
            echo "::warning::Failed to trigger branch ${{ matrix.branch }}"
          }